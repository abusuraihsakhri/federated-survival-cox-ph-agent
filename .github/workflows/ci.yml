name: Tests and security checks
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[server,test]"
      - name: Compile Python
        run: python -m compileall -q agents fed_cox_ph cli.py enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q
      - name: Validate browser script
        run: |
          node --check web/app.js
          node --test web/app.test.cjs
      - name: Package smoke test
        run: |
          federated-survival-cox-ph-agent --help
          fed-cox-ph-legacy --help
