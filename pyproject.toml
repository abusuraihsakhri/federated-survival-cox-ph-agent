[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-survival-cox-ph-engine"
version = "2.0.0"
description = "Rule-based task auditing and an experimental aggregated Cox PH estimator"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
federated-survival-cox-ph-agent = "cli:main"
fed-cox-ph-legacy = "fed_cox_ph.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/federated-survival-cox-ph-agent"
Repository = "https://github.com/abusuraihsakhri/federated-survival-cox-ph-agent.git"

[tool.setuptools]
py-modules = ["cli", "simulator", "enrichment", "fed_cox_ph_app"]

[tool.setuptools.packages.find]
include = ["agents*", "fed_cox_ph*"]
