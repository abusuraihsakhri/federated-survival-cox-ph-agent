[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-survival-cox-ph-engine"
version = "2.0.0"
description = "FedCox-PH: Federated Stratified Cox Proportional Hazards Regression Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
federated-survival-cox-ph-engine = "fed_cox_ph.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/federated-survival-cox-ph-engine"
Repository = "https://github.com/abusuraihsakhri/federated-survival-cox-ph-engine.git"
